<app-button
  icon="add"
  [matButtonType]="buttonText() ? 'matRaisedButton' : 'iconButton'"
  [buttonText]="buttonText() ?? ''"
  [color]="color"
  type="button"
  [tooltip]="tooltip ?? ''"
  [disabled]="disabled()"
  [routerLink]="buttonRouterLink()"
  (clicked)="clicked.emit($event)"
></app-button>
