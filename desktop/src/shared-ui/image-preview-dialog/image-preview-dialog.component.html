<div class="image-preview-dialog">
  <button
    class="image-preview-dialog__close"
    mat-icon-button
    type="button"
    aria-label="Close"
    data-testid="image-preview-close"
    (click)="close()"
  >
    <mat-icon>close</mat-icon>
  </button>
  <div class="image-preview-dialog__scroll">
    <img
      class="image-preview-dialog__img"
      [src]="data.src"
      [alt]="data.alt ?? 'Receipt image'"
    />
  </div>
</div>
