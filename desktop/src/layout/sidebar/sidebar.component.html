<div
  class="app-shell drawer-content"
  [class.drawer-content--full-height]="isContentFullHeight()"
>
  <app-header class="d-block sticky-top"></app-header>
  <div
    [ngClass]="{
    'p-4': isLoggedIn() && !isContentFullHeight(),
    }"
    class="d-block drawer-outlet"
  >
    <router-outlet></router-outlet>
  </div>
</div>
